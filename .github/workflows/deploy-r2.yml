name: Deploy to R2

# 为什么这个工作流放在 chat-demo（公开仓库）而不是站点仓库：
# 分支约定：main 只跟踪官方 deepseek-ai/chat-demo，不放任何本地改动，永远可以
# 对 upstream/main 做 fast-forward；本站的定制全部在 deploy 分支上，本 workflow
# 也只监听 deploy。
# 同步官方更新：git fetch upstream
#             git checkout main    && git merge --ff-only upstream/main && git push
#             git checkout deploy  && git rebase main && git push --force-with-lease
#
# 本仓库是公开的，而站点仓库是私有的：私有仓库的 Actions 分钟数计入免费额度，
# 公开仓库完全不计费。chat/ 是本仓库的构建产物，构建和上传都留在这里，不该去
# 占用私有仓库的额度。
#
# 产物推到 R2 的 chat/ 前缀，该前缀由线上 Worker 用 Basic Auth 保护，和站点
# 其他页面同一套密码。域名与密码都不写进仓库，走 secrets（SITE_URL /
# SITE_PASSWORD），避免公开仓库暴露站点归属。

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-r2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          B="s3://$R2_BUCKET/chat/"
          ep="$R2_ENDPOINT"

          # ── 为什么不用 aws s3 sync ──
          # sync 靠「大小 + 修改时间」判断是否上传，而 CI 里 checkout/build 出来的
          # 文件 mtime 全是新的，所以每次 162 个文件统统被判定「已变更」。之前为了
          # 给不同扩展名设 content-type 跑了 11 次独立 sync，等于把同一份目录完整
          # 比对 11 遍，实测 34 秒 —— 而真正变化的文件只有几个。
          #
          # rspack 的产物名自带内容哈希（main.b0f02645.js），文件名相同即内容相同。
          # 所以正确做法是拿远端已有文件名做差集：一次 list 就够，没改动的不碰。
          echo "列出远端已有对象…"
          aws s3 ls "${B}" --recursive --endpoint-url "$ep" \
            | awk '{print $4}' | sed "s|^chat/||" | grep -v '/$' | sort > /tmp/remote.txt || true
          echo "  远端 $(wc -l < /tmp/remote.txt) 个对象"

          ( cd dist && find . -type f | sed 's|^\./||' | sort ) > /tmp/local.txt
          echo "  本地 $(wc -l < /tmp/local.txt) 个文件"

          # 差集：本地有、远端没有的 = 新哈希产物，必须传
          comm -23 /tmp/local.txt /tmp/remote.txt > /tmp/upload.txt

          # 名字固定但内容会变的三类文件必须无条件重传。它们的文件名里没有哈希，
          # 远端总是「已存在」，光靠差集会永远不更新：
          #   index.html   每次构建都只换一行 hash 引用，长度经常一模一样
          #   manifest.json / sw.js  PWA 元信息，改了要立刻生效
          for f in index.html manifest.json sw.js; do
            [ -f "dist/$f" ] && echo "$f" >> /tmp/upload.txt
          done

          sort -u /tmp/upload.txt -o /tmp/upload.txt
          echo "  需要上传 $(wc -l < /tmp/upload.txt) 个（其中固定名文件 3 个）"
          echo "  跳过 $(comm -12 /tmp/local.txt /tmp/remote.txt | wc -l) 个未改动文件"

          # 并发上传：每次 aws s3 cp 约 1 秒（开销主要在起进程 + TLS 握手），
          # 串行传几十个就要几十秒，8 路并发能把这一段压到几秒。
          ct_of() {
            case "$1" in
              *.html)        echo "text/html; charset=utf-8" ;;
              *.js)          echo "application/javascript; charset=utf-8" ;;
              *.css)         echo "text/css; charset=utf-8" ;;
              *.json)        echo "application/json; charset=utf-8" ;;
              *.webmanifest) echo "application/manifest+json" ;;
              *.woff2)       echo "font/woff2" ;;
              *.woff)        echo "font/woff" ;;
              *.ttf)         echo "font/ttf" ;;
              *.png)         echo "image/png" ;;
              *.ico)         echo "image/x-icon" ;;
              *.svg)         echo "image/svg+xml" ;;
              *)             echo "application/octet-stream" ;;
            esac
          }
          export -f ct_of

          upload_one() {
            local rel="$1"
            local extra=()
            # 固定名文件的缓存策略单独指定；带哈希的可以直接长缓存
            case "$rel" in
              index.html|manifest.json|sw.js)
                extra=(--cache-control "public, max-age=60, must-revalidate") ;;
              *)
                extra=(--cache-control "public, max-age=31536000, immutable") ;;
            esac
            aws s3 cp "dist/$rel" "s3://$R2_BUCKET/chat/$rel" \
              --endpoint-url "$ep" \
              --content-type "$(ct_of "$rel")" \
              "${extra[@]}" --no-progress --quiet
          }
          export -f upload_one
          export R2_BUCKET ep

          if [ -s /tmp/upload.txt ]; then
            xargs -a /tmp/upload.txt -P 8 -I{} bash -c 'upload_one "$@"' _ {}
            echo "上传完成"
          else
            echo "没有需要上传的文件"
          fi

      - name: Verify deployed version
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          # 刚传完就读一次，确认 index.html 引用的 JS 确实在线上能取到，
          # 避免「传上去了但引用的是旧文件」这种静默失败。
          html=$(curl -fsS -u ":$SITE_PASSWORD" --max-time 30 "$SITE_URL/chat/" || true)
          if [ -z "$html" ]; then
            echo "::error::读不到 /chat/，线上可能没生效"
            exit 1
          fi
          js=$(printf '%s' "$html" | grep -o 'main\.[0-9a-f]*\.js' | head -1 || true)
          echo "index.html 引用: $js"
          code=$(curl -s -o /dev/null -w '%{http_code}' -u ":$SITE_PASSWORD" --max-time 30 \
                 "$SITE_URL/chat/static/js/$js" || true)
          echo "该 JS 的 HTTP 状态: $code"
          [ "$code" = "200" ] || { echo "::error::引用的 JS 取不到（$code）"; exit 1; }
